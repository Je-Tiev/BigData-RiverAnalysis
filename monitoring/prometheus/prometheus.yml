# ========================================================
# Big Data River Quality Platform - Prometheus Scrape Config
# ========================================================

global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # Self Monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Spark Master & Streaming Cluster Metrics
  - job_name: "spark_cluster"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["spark-master:8080"]
    scrape_interval: 15s

  # InfluxDB Time-Series Engine Metrics
  - job_name: "influxdb"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["influxdb:8086"]

  # FastAPI Model Serving Microservice
  - job_name: "model_serving_api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8000"]
    scrape_interval: 5s
