# ========================================================
# Big Data River Quality Platform - Production Compose
# ========================================================

x-spark-common: &spark-common
  build:
    context: .
    dockerfile: Dockerfile.spark
  image: river-spark:3.5.0
  volumes:
    - ./streaming:/opt/jobs
    - ./src:/opt/src
    - spark_checkpoints:/opt/spark-data/checkpoints
    - spark_delta:/opt/spark-data/delta
  networks:
    - river-net
  restart: unless-stopped

services:
  # ========================================================
  # Kafka Controller (KRaft Mode)
  # ========================================================
  kafka-controller:
    image: apache/kafka:4.0.1
    container_name: kafka-controller
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-controller:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_controller_data:/var/lib/kafka/data
    networks:
      - river-net
    restart: unless-stopped

  # ========================================================
  # Kafka Broker Node
  # ========================================================
  kafka-broker:
    image: apache/kafka:4.0.1
    container_name: kafka-broker
    ports:
      - "29092:9092"
    environment:
      KAFKA_NODE_ID: 4
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,PLAINTEXT_HOST://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-broker:19092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-controller:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      - kafka-controller
    networks:
      - river-net
    restart: unless-stopped

  # ========================================================
  # Kafka Web UI (Management & Topic Inspection)
  # ========================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: RiverTelemetryCluster
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: kafka-broker:19092
    depends_on:
      - kafka-broker
    networks:
      - river-net
    restart: unless-stopped

  # ========================================================
  # MinIO (S3-Compatible Object Storage for Lakehouse)
  # ========================================================
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address :9001
    ports:
      - "9000:9000"
      - "30001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-password123}
    volumes:
      - minio_data:/data
    networks:
      - river-net
    restart: unless-stopped

  # ========================================================
  # InfluxDB 2.x (Time-Series Metric Store)
  # ========================================================
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-password123}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-water-quality}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-river-data}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-my-super-secret-auth-token}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    networks:
      - river-net
    restart: unless-stopped

  # ========================================================
  # Spark Master (Unified Distributed Master Node)
  # ========================================================
  spark-master:
    <<: *spark-common
    container_name: spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master
      --port 7077
      --webui-port 8080
    environment:
      SPARK_MASTER_WEBUI_PORT: 8080
      KAFKA_BOOTSTRAP: kafka-broker:19092
      KAFKA_TOPIC_RAW: ${KAFKA_TOPIC_RAW:-river.sensors.raw}
      KAFKA_TOPIC_DLQ: ${KAFKA_TOPIC_DLQ:-river.sensors.dlq}
      KAFKA_TOPIC_ALERTS: ${KAFKA_TOPIC_ALERTS:-river.alerts.critical}
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-my-super-secret-auth-token}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-water-quality}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-river-data}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-password123}
      MINIO_BUCKET: ${MINIO_BUCKET:-water-quality-lakehouse}
    ports:
      - "7077:7077"
      - "9090:8080"
    depends_on:
      - kafka-broker
      - influxdb
      - minio

  # ========================================================
  # Spark Worker (Unified Distributed Worker Node)
  # ========================================================
  spark-worker:
    <<: *spark-common
    container_name: spark-worker
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: 4
      SPARK_WORKER_MEMORY: 4G
      SPARK_WORKER_WEBUI_PORT: 8081
      KAFKA_BOOTSTRAP: kafka-broker:19092
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-my-super-secret-auth-token}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-water-quality}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-river-data}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-password123}
      MINIO_BUCKET: ${MINIO_BUCKET:-water-quality-lakehouse}
    ports:
      - "9091:8081"
    depends_on:
      - spark-master

  # ========================================================
  # PostgreSQL (Airflow Metadata Database)
  # ========================================================
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - river-net
    restart: unless-stopped

  # ========================================================
  # Airflow Webserver (Lakehouse Orchestrator UI)
  # ========================================================
  airflow-webserver:
    image: apache/airflow:2.8.3-python3.10
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8085:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:-airflow}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "secret-key-for-river-airflow"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-password123}
      MINIO_BUCKET: ${MINIO_BUCKET:-water-quality-lakehouse}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - airflow_logs:/opt/airflow/logs
    networks:
      - river-net
    restart: unless-stopped
    depends_on:
      - postgres

  # ========================================================
  # Airflow Scheduler (DAG Execution Engine)
  # ========================================================
  airflow-scheduler:
    image: apache/airflow:2.8.3-python3.10
    container_name: airflow-scheduler
    command: scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:-airflow}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-password123}
      MINIO_BUCKET: ${MINIO_BUCKET:-water-quality-lakehouse}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - airflow_logs:/opt/airflow/logs
    networks:
      - river-net
    restart: unless-stopped
    depends_on:
      - postgres

  # ========================================================
  # Grafana (Dashboard & Pipeline Monitoring)
  # ========================================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "30003:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - river-net
    restart: unless-stopped
    depends_on:
      - influxdb

# ========================================================
# Networks & Volumes
# ========================================================
networks:
  river-net:
    driver: bridge

volumes:
  minio_data:
  influxdb_data:
  influxdb_config:
  kafka_controller_data:
  spark_checkpoints:
  spark_delta:
  postgres_data:
  airflow_logs:
  grafana_data:
