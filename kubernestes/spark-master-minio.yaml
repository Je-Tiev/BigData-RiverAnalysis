apiVersion: v1
kind: Service
metadata:
  name: spark-master-minio
  namespace: river-analysis
spec:
  type: ClusterIP
  ports:
    - port: 7077
      targetPort: 7077
      name: spark
    - port: 8080
      targetPort: 8080
      name: webui
  selector:
    app: spark-master-minio
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master-minio
  namespace: river-analysis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-master-minio
  template:
    metadata:
      labels:
        app: spark-master-minio
    spec:
      containers:
      - name: spark-master
        image: hiesu19/spark-custom:3.5.7
        command:
          - /opt/spark/bin/spark-class
          - org.apache.spark.deploy.master.Master
          - --host
          - spark-master-minio
          - --port
          - "7077"
          - --webui-port
          - "8080"
        ports:
        - containerPort: 7077
          name: spark
        - containerPort: 8080
          name: webui
        env:
        - name: SPARK_MASTER_WEBUI_PORT
          value: "8080"
        - name: KAFKA_BOOTSTRAP
          value: "kafka-broker:19092"
        - name: KAFKA_TOPIC
          value: "river-quality"
        - name: MINIO_ENDPOINT
          value: "minio:9000"
        - name: MINIO_ROOT_USER
          value: "admin"
        - name: MINIO_ROOT_PASSWORD
          value: "password123"
        volumeMounts:
        - name: jobs
          mountPath: /opt/jobs
        - name: spark-data
          mountPath: /opt/spark-data
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      volumes:
      - name: jobs
        configMap:
          name: spark-jobs
      - name: spark-data
        persistentVolumeClaim:
          claimName: spark-data-minio
      initContainers:
      - name: wait-for-kafka
        image: busybox:1.35
        command: ['sh', '-c', 'until nc -z kafka-broker 19092; do echo waiting for kafka-broker; sleep 2; done;']
      - name: wait-for-minio
        image: busybox:1.35
        command: ['sh', '-c', 'until nc -z minio 9000; do echo waiting for minio; sleep 2; done;']

