# ==============================================================================
# Big Data River Quality Platform - Production Compose Architecture
# ==============================================================================
# Services:
#   - Messaging: Kafka KRaft Controller, Kafka Broker, Kafka UI
#   - Storage: MinIO (Delta Lakehouse S3), InfluxDB 2.x (Time-series)
#   - Compute: Apache Spark Master & Worker (Delta Lake 3.2.0 enabled)
#   - Orchestration: PostgreSQL 15, Airflow Init, Webserver & Scheduler
#   - Observability: Prometheus (Scraping), Grafana (Provisioned Dashboards)
#   - AI & Operations: FastAPI Model Serving (8000), Streamlit GIS Dashboard (8501)
# ==============================================================================

x-spark-common: &spark-common
  build:
    context: .
    dockerfile: Dockerfile.spark
  image: river-spark:3.5.0
  pull_policy: build
  volumes:
    - ./streaming:/opt/jobs
    - ./src:/opt/src
    - spark_checkpoints:/opt/spark-data/checkpoints
    - spark_delta:/opt/spark-data/delta
  networks:
    - river-net
  restart: unless-stopped

x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile
  image: river-app:latest
  pull_policy: build
  volumes:
    - ./src:/app/src
    - ./monitoring:/app/monitoring
  networks:
    - river-net
  restart: unless-stopped

services:
  # ========================================================
  # 1. Kafka Controller (KRaft Mode)
  # ========================================================
  kafka-controller:
    image: apache/kafka:4.0.1
    container_name: kafka-controller
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-controller:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_controller_data:/var/lib/kafka/data
    networks:
      - river-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.75'

  # ========================================================
  # 2. Kafka Broker Node
  # ========================================================
  kafka-broker:
    image: apache/kafka:4.0.1
    container_name: kafka-broker
    ports:
      - "29092:9092"
    environment:
      KAFKA_NODE_ID: 4
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,PLAINTEXT_HOST://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-broker:19092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-controller:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      - kafka-controller
    volumes:
      - kafka_broker_data:/var/lib/kafka/data
    networks:
      - river-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.5'

  # ========================================================
  # 3. Kafka Web UI (Management & Topic Inspection)
  # ========================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: RiverTelemetryCluster
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: kafka-broker:19092
    depends_on:
      - kafka-broker
    networks:
      - river-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # ========================================================
  # 4. MinIO (S3-Compatible Object Storage for Delta Lakehouse)
  # ========================================================
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio
    command: server /data --console-address :9001
    ports:
      - "9000:9000"
      - "30001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-password123}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    volumes:
      - minio_data:/data
    networks:
      - river-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # ========================================================
  # 5. InfluxDB 2.x (Time-Series Metric Store)
  # ========================================================
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-password123}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-water-quality}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-river-data}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-my-super-secret-auth-token}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    networks:
      - river-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # ========================================================
  # 6. Spark Master (Unified Distributed Compute Engine)
  # ========================================================
  spark-master:
    <<: *spark-common
    container_name: spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master
      --port 7077
      --webui-port 8080
    environment:
      SPARK_MASTER_WEBUI_PORT: 8080
      KAFKA_BOOTSTRAP: kafka-broker:19092
      KAFKA_TOPIC_RAW: ${KAFKA_TOPIC_RAW:-river.sensors.raw}
      KAFKA_TOPIC_DLQ: ${KAFKA_TOPIC_DLQ:-river.sensors.dlq}
      KAFKA_TOPIC_ALERTS: ${KAFKA_TOPIC_ALERTS:-river.alerts.critical}
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-my-super-secret-auth-token}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-water-quality}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-river-data}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-password123}
      MINIO_BUCKET: ${MINIO_BUCKET:-water-quality-lakehouse}
    ports:
      - "7077:7077"
      - "9090:8080"
    depends_on:
      - kafka-broker
      - influxdb
      - minio
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: '1.5'

  # ========================================================
  # 7. Spark Worker (Unified Distributed Worker Node)
  # ========================================================
  spark-worker:
    <<: *spark-common
    container_name: spark-worker
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: 4
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_WEBUI_PORT: 8081
      KAFKA_BOOTSTRAP: kafka-broker:19092
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-my-super-secret-auth-token}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-water-quality}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-river-data}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-password123}
      MINIO_BUCKET: ${MINIO_BUCKET:-water-quality-lakehouse}
    ports:
      - "9091:8081"
    depends_on:
      - spark-master
    deploy:
      resources:
        limits:
          memory: 2.5G
          cpus: '2.0'

  # ========================================================
  # 8. PostgreSQL (Airflow Metadata Database)
  # ========================================================
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - river-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.75'

  # ========================================================
  # 9. Airflow Database Init
  # ========================================================
  airflow-init:
    image: apache/airflow:2.8.3-python3.10
    container_name: airflow-init
    command: >
      bash -c "airflow db migrate && airflow users create --username admin --firstname River --lastname Admin --role Admin --email admin@river.local --password admin || true"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:-airflow}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - river-net
    restart: on-failure

  # ========================================================
  # 10. Airflow Webserver (Lakehouse Orchestrator UI)
  # ========================================================
  airflow-webserver:
    image: apache/airflow:2.8.3-python3.10
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8085:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:-airflow}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "secret-key-for-river-airflow"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-password123}
      MINIO_BUCKET: ${MINIO_BUCKET:-water-quality-lakehouse}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - airflow_logs:/opt/airflow/logs
    networks:
      - river-net
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # ========================================================
  # 11. Airflow Scheduler (DAG Execution Engine)
  # ========================================================
  airflow-scheduler:
    image: apache/airflow:2.8.3-python3.10
    container_name: airflow-scheduler
    command: scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:-airflow}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-password123}
      MINIO_BUCKET: ${MINIO_BUCKET:-water-quality-lakehouse}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - airflow_logs:/opt/airflow/logs
    networks:
      - river-net
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # ========================================================
  # 12. Prometheus (Big Data Metrics Collection Engine)
  # ========================================================
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9095:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - river-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.75'

  # ========================================================
  # 13. Grafana (Dashboard & Pipeline Monitoring)
  # ========================================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "30003:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - river-net
    restart: unless-stopped
    depends_on:
      - influxdb
      - prometheus
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.75'

  # ========================================================
  # 14. River ML Model Serving API (FastAPI)
  # ========================================================
  river-api:
    <<: *app-common
    container_name: river-api
    command: python -m uvicorn src.serving.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - river-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # ========================================================
  # 15. River Operations Command Center (Streamlit Dashboard)
  # ========================================================
  river-dashboard:
    <<: *app-common
    container_name: river-dashboard
    command: streamlit run src/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      STREAMLIT_SERVER_PORT: 8501
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    depends_on:
      - river-api
    networks:
      - river-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

# ========================================================
# Networks & Volumes
# ========================================================
networks:
  river-net:
    driver: bridge

volumes:
  kafka_controller_data:
  kafka_broker_data:
  minio_data:
  influxdb_data:
  influxdb_config:
  spark_checkpoints:
  spark_delta:
  postgres_data:
  airflow_logs:
  prometheus_data:
  grafana_data:
