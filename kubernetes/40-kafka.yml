apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data
  namespace: river-analysis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: river-analysis
spec:
  type: ClusterIP
  selector:
    app: kafka
  ports:
    - name: internal
      port: 19092
      targetPort: 19092
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-external
  namespace: river-analysis
spec:
  type: LoadBalancer
  selector:
    app: kafka
  ports:
    - name: external
      port: 29092
      targetPort: 9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: river-analysis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:4.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: controller
              containerPort: 9093
            - name: internal
              containerPort: 19092
            - name: host
              containerPort: 9092
          env:
            # Chạy Kafka KRaft (không dùng Zookeeper), gộp broker + controller 1 node
            - name: KAFKA_NODE_ID
              value: '1'
            - name: KAFKA_PROCESS_ROLES
              value: 'broker,controller'
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: 'CONTROLLER'
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: 'PLAINTEXT'
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
            - name: KAFKA_LISTENERS
              value: 'CONTROLLER://:9093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092'
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: '1@kafka:9093'
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: '0'

            # QUAN TRỌNG:
            # - Listener internal (trong cluster): kafka:19092
            # - Listener external (ngoài cluster): <EXTERNAL_IP>:29092 (được Service kafka-external expose)
            # Bạn cần cập nhật <EXTERNAL_IP> sau khi Service có IP (xem kubernetes/README.md).
            - name: KAFKA_ADVERTISED_LISTENERS
              value: 'PLAINTEXT://kafka:19092,PLAINTEXT_HOST://REPLACE_ME:29092'
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 2Gi
      volumes:
        - name: kafka-data
          persistentVolumeClaim:
            claimName: kafka-data
