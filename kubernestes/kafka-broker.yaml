apiVersion: v1
kind: Service
metadata:
  name: kafka-broker
  namespace: river-analysis
spec:
  type: LoadBalancer
  ports:
    - port: 29092
      targetPort: 9092
      protocol: TCP
      name: external
    - port: 19092
      targetPort: 19092
      protocol: TCP
      name: internal
  selector:
    app: kafka-broker
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-broker
  namespace: river-analysis
spec:
  serviceName: kafka-broker
  replicas: 1
  selector:
    matchLabels:
      app: kafka-broker
  template:
    metadata:
      labels:
        app: kafka-broker
    spec:
      containers:
      - name: kafka
        image: apache/kafka:4.0.1
        ports:
        - containerPort: 9092
          name: external
        - containerPort: 19092
          name: internal
        env:
        - name: KAFKA_NODE_ID
          value: "4"
        - name: KAFKA_PROCESS_ROLES
          value: "broker"
        - name: KAFKA_LISTENERS
          value: "PLAINTEXT://:19092,PLAINTEXT_HOST://:9092"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://kafka-broker:19092,PLAINTEXT_HOST://kafka-broker.river-analysis.svc.cluster.local:29092"
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: "PLAINTEXT"
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: "CONTROLLER"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: "1@kafka-controller:9093"
        - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
          value: "0"
        - name: KAFKA_LOG_DIRS
          value: "/var/lib/kafka/data"
        volumeMounts:
        - name: data
          mountPath: /var/lib/kafka/data
      initContainers:
      - name: wait-for-controller
        image: busybox:1.35
        command: ['sh', '-c', 'until nc -z kafka-controller 9093; do echo waiting for kafka-controller; sleep 2; done;']
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: standard-ssd
      resources:
        requests:
          storage: 20Gi

