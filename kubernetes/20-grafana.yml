apiVersion: v1
kind: Secret
metadata:
  name: grafana-secrets
  namespace: river-analysis
type: Opaque
stringData:
  GF_SECURITY_ADMIN_PASSWORD: admin123
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-storage
  namespace: river-analysis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: river-analysis
data:
  influxdb.yml: |
    apiVersion: 1

    datasources:
      - name: InfluxDB
        type: influxdb
        access: proxy
        url: http://influxdb:8086
        jsonData:
          version: Flux
          organization: water-quality
          defaultBucket: river-data
          tlsSkipVerify: true
        secureJsonData:
          token: my-super-secret-auth-token
  dashboard.yml: |
    apiVersion: 1

    providers:
      - name: 'default'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: river-analysis
data:
  water_quality_dashboard.json: |-
    {
      "id": null,
      "title": "Water Quality Dashboard",
      "tags": ["water", "quality", "influxdb"],
      "timezone": "browser",
      "panels": [
        {
          "id": 1,
          "title": "Ammonia Over Time",
          "type": "timeseries",
          "targets": [
            {
              "query": "from(bucket: \"river-data\")\r\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\r\n  |> filter(fn: (r) => r[\"_field\"] == \"ammonia\")\r\n  |> aggregateWindow(every: v.windowPeriod, fn: mean, createEmpty: false)\r\n  |> yield(name: \"mean\")",
              "refId": "A"
            }
          ],
          "datasource": "InfluxDB",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          }
        },
        {
          "id": 2,
          "title": "CCME Score Over Time",
          "type": "timeseries",
          "targets": [
            {
              "query": "from(bucket: \"river-data\")\r\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\r\n  |> filter(fn: (r) => r[\"_field\"] == \"ccme_score\")\r\n  |> aggregateWindow(every: v.windowPeriod, fn: last, createEmpty: false)\r\n  |> yield(name: \"last\")",
              "refId": "A"
            }
          ],
          "datasource": "InfluxDB",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          }
        },

        {
          "id": 3,
          "title": "Dissolved Oxygen Over Time",
          "type": "timeseries",
          "targets": [
            {
              "query": "from(bucket: \"river-data\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r[\"_field\"] == \"dissolved_oxygen\")\n  |> aggregateWindow(every: v.windowPeriod, fn: mean, createEmpty: false)\n  |> yield(name: \"mean\")",
              "refId": "A"
            }
          ],
          "datasource": "InfluxDB",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "mg/L"
            }
          }
        },
        {
          "id": 4,
          "title": "Quality Label Distribution (%)",
          "type": "piechart",
          "pluginVersion": "12.3.0",
          "datasource": "InfluxDB",
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket: \"river-data\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) =>\n    r[\"quality_label\"] == \"Good\" or\n    r[\"quality_label\"] == \"Fair\" or\n    r[\"quality_label\"] == \"Marginal\" or\n    r[\"quality_label\"] == \"Poor\"\n  )\n  |> group(columns: [\"quality_label\"])\n  |> count()\n  |> yield(name: \"count\")"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "pieType": "pie",
            "reduceOptions": {
              "calcs": ["last"],
              "fields": "",
              "values": false
            },
            "displayLabels": ["percent", "name"],
            "tooltip": {
              "mode": "single"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            }
          }
        },
        {
          "id": 5,
          "title": "Hardness Over Time",
          "type": "timeseries",
          "targets": [
            {
              "query": "from(bucket: \"river-data\")\r\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\r\n  |> filter(fn: (r) => r[\"_field\"] == \"hardness\")\r\n  |> aggregateWindow(every: v.windowPeriod, fn: mean, createEmpty: false)\r\n  |> yield(name: \"mean\")",
              "refId": "A"
            }
          ],
          "datasource": "InfluxDB",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "mg/L as CaCO3"
            }
          }
        }
      ],
      "time": {
        "from": "now-20y",
        "to": "now"
      },
      "timepicker": {},
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      },
      "refresh": "5s",
      "schemaVersion": 27,
      "version": 0,
      "links": []
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: river-analysis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
        fsGroupChangePolicy: 'OnRootMismatch'
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Đang sửa quyền thư mục /var/lib/grafana ..."
              mkdir -p /var/lib/grafana/plugins /var/lib/grafana/dashboards
              chown -R 472:472 /var/lib/grafana
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana
      containers:
        - name: grafana
          image: grafana/grafana:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-secrets
                  key: GF_SECURITY_ADMIN_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 472
            runAsGroup: 472
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana
            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning/datasources/influxdb.yml
              subPath: influxdb.yml
            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboard.yml
              subPath: dashboard.yml
            - name: grafana-dashboards
              mountPath: /var/lib/grafana/dashboards/water_quality_dashboard.json
              subPath: water_quality_dashboard.json
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
      volumes:
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: grafana-storage
        - name: grafana-provisioning
          configMap:
            name: grafana-provisioning
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: river-analysis
spec:
  type: LoadBalancer
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
